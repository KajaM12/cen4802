name: Java Maven CI

on:
  push:
    branches:
      - main
      - 'feature/**'
  pull_request:
    branches:
      - main

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '24'
          cache: maven

      - name: Build, test, and package
        run: mvn --batch-mode clean verify

      - name: Upload WAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: HibernateToDoApp-WAR
          path: target/*.war
          if-no-files-found: error

  build-docker-image:
    runs-on: ubuntu-latest
    needs: build-and-test

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Download WAR artifact
        uses: actions/download-artifact@v4
        with:
          name: HibernateToDoApp-WAR
          path: target/

      - name: Build Docker image
        run: docker build -t hibernatetodoapp:${{ github.sha }} .

      - name: Confirm Docker image exists
        run: docker image inspect hibernatetodoapp:${{ github.sha }}

      - name: Save Docker image
        run: docker save hibernatetodoapp:${{ github.sha }} | gzip > hibernatetodoapp-image.tar.gz

      - name: Upload Docker image artifact
        uses: actions/upload-artifact@v4
        with:
          name: HibernateToDoApp-Docker-Image
          path: hibernatetodoapp-image.tar.gz
          if-no-files-found: error
          retention-days: 7